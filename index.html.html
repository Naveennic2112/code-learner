<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0f1a">
<title>Code Learner</title>
<style>
:root{--bg:#0b0f1a;--card:#141b2d;--line:#222d47;--txt:#e8ecf7;--mut:#8b96b3;--a:#6366F1;--b:#06B6D4;--ok:#34d399;--bad:#f87171;--py:linear-gradient(135deg,#3b82f6,#fbbf24);--sq:linear-gradient(135deg,#06B6D4,#6366F1)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(circle at top,#1b1640,var(--bg) 60%);color:var(--txt);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;backdrop-filter:blur(12px);background:rgba(11,15,26,.75);border-bottom:1px solid var(--line)}
#top .title{font-weight:800;flex:1;color:#c7d2fe}
#top .back{background:none;border:0;color:var(--b);font-weight:700;font-size:16px;cursor:pointer;padding:4px 6px 4px 0}
#top .back[hidden]{display:none}
.xp{font-size:14px;color:var(--mut);font-weight:600}
main{max-width:920px;margin:0 auto;padding:16px}
/* splash */
.splash{min-height:calc(100vh - 120px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:12px}
.logo-wrap{width:100%;max-width:560px}
.logo-wrap svg{width:100%;height:auto;display:block}
.appname{font-size:34px;margin:18px 0 4px;background:linear-gradient(90deg,#60a5fa,#c084fc,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
.splash p{color:var(--mut);margin:0 0 22px}
.start{border:0;border-radius:999px;padding:14px 30px;font-size:16px;font-weight:700;color:#fff;background:var(--a);cursor:pointer}
/* cards */
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.tile{border-radius:20px;padding:20px;color:#fff;cursor:pointer;background:var(--py);border:1px solid rgba(255,255,255,.08);transition:transform .15s}
.tile.sq{background:var(--sq)}
.tile:hover,.tile:active{transform:translateY(-2px)}
.tile h2{margin:0 0 6px;font-size:24px}
.tile p{margin:0;opacity:.92;font-size:14px}
.tile .prog{margin-top:12px;font-size:13px;font-weight:700;opacity:.95}
.lvl{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-bottom:12px}
.lvl:hover,.lvl:active{border-color:var(--a)}
.lvl b{font-size:18px}
.lvl span{display:block;color:var(--mut);font-size:13px;margin-top:4px}
.lvl em{font-style:normal;font-size:20px;color:var(--b)}
.hero{border-radius:20px;padding:20px;background:var(--py);color:#fff;margin-bottom:16px}
.hero.sq{background:var(--sq)}
.hero h2{margin:0 0 4px;font-size:22px}
.hero p{margin:0;opacity:.92;font-size:14px}
.bar{height:8px;background:rgba(0,0,0,.25);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:#fff;width:0;transition:width .4s}
/* topics */
.topic{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;transition:transform .15s,border-color .15s}
.topic:hover,.topic:active{transform:translateY(-2px);border-color:var(--a)}
.topic.locked{opacity:.65;cursor:not-allowed}
.topic.locked:hover,.topic.locked:active{transform:none;border-color:var(--line)}
.topic .row{display:flex;gap:12px;align-items:center}
.num{width:44px;height:44px;flex:0 0 44px;border-radius:14px;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--a)}
.topic.done .num{background:var(--ok)}
.topic.locked .num{background:#334155}
.topic b{display:block;font-size:16px}
.ex{margin:10px 0 0;padding-left:20px;color:var(--mut);font-size:13.5px;line-height:1.55}
.ex li{margin-bottom:2px}
.tag{display:inline-block;margin-top:8px;font-size:12px;color:#fbbf24;font-weight:600}
/* lesson */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}
.card h2{margin:6px 0 8px;font-size:22px}
.card h3{margin:0 0 6px}
.pill{display:inline-block;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--line);color:var(--mut);font-weight:600}
.card .ex{color:var(--txt);font-size:15px;margin-bottom:6px}
.pre{background:#070a13;border:1px solid var(--line);border-radius:14px;padding:14px;overflow-x:auto;font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;color:#c7d2fe;white-space:pre}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#0f1526;color:var(--txt);font:15px ui-monospace,Menlo,Consolas,monospace;cursor:pointer}
.opt:disabled{opacity:.6;cursor:not-allowed}
.opt.ok{border-color:var(--ok);background:rgba(52,211,153,.12)}
.opt.bad{border-color:var(--bad);background:rgba(248,113,113,.12)}
.fb{margin-top:10px;font-size:14px;color:var(--mut);min-height:20px}
.nextbtn{margin-top:12px;width:100%;padding:13px;border:0;border-radius:12px;background:var(--a);color:#fff;font-weight:700;font-size:16px;cursor:pointer;display:none}
.auth{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 4px 40px}
.auth .logo-wrap{width:100%;max-width:520px}
.auth .logo-wrap svg{width:100%;height:auto;display:block}
.auth .appname{font-size:30px;margin:14px 0 2px}
.sub{color:var(--mut);margin:0 0 4px}
.signup{width:100%;max-width:420px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}
.signup label{display:block;font-size:13px;color:var(--mut);font-weight:600;margin-bottom:14px}
.signup input{width:100%;margin-top:6px;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0f1526;color:var(--txt);font-size:15px;outline:none}
.signup input:focus{border-color:var(--a)}
.pw{display:flex;gap:8px}
.pw input{flex:1;min-width:0}
.pw button{border:1px solid var(--line);background:#0f1526;color:var(--b);border-radius:12px;padding:0 12px;font-weight:700;cursor:pointer}
.meter{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:-4px 0 6px}
.meter i{display:block;height:100%;width:0;transition:width .3s,background .3s}
.hint{color:var(--mut);font-size:12px}
.signup .start{width:100%;margin-top:14px}
.msg{margin-top:12px;font-size:14px;color:var(--ok);min-height:20px;text-align:left}
.msg.err{color:var(--bad)}
.flow{list-style:none;padding:0;margin:14px 0 0;width:100%;max-width:420px;text-align:left;font-size:13px;color:var(--mut)}
.flow li{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--a);border-radius:10px;padding:9px 12px;margin-bottom:8px;line-height:1.45}
.flow li.note{border-left-color:#fbbf24;color:#fde68a}
footer{text-align:center;color:var(--mut);font-size:12px;padding:24px 16px 40px}
</style>
</head>

  <button class="back" id="back" onclick="goBack()" hidden>← Back</button>
  <span class="title" id="title">Code Learner</span>
  <span class="xp" id="xp">⭐ 0 XP</span>
</div>
<main><div id="app"></div></main>

const LANGS = {
  python:{name:"🐍 Python",cls:"",desc:"Clean, readable, and used everywhere from web apps to AI."},
  sql:{name:"🗄️ SQL",cls:"sq",desc:"The language of data. Ask questions of tables and get answers."}
};
const LEVELS = {
  beginner:"Start from zero with short lessons and instant quizzes.",
  intermediate:"Level up with real-world patterns and problem solving.",
  advanced:"Master the tools professionals use every day."
};
const PARENT = {langs:"home", levels:"langs", topics:"levels", lesson:"topics"};

let scr = "home", lang = "python", lvl = "beginner", cur = null, pts = 0;
const done = new Set();

const cap = s => s[0].toUpperCase() + s.slice(1);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const $ = id => document.getElementById(id);
const exList = e => `<ul class="ex">${e.split("|").map(l => `<li>${esc(l)}</li>`).join("")}</ul>`;
const items = () => DATA[lang][lvl];
const unlocked = i => i === 0 || done.has(lang+lvl+(i-1));
const prog = (l, v) => DATA[l][v].filter((_, i) => done.has(l+v+i)).length;

function go(s){ scr = s; render(); window.scrollTo(0, 0); }
function goBack(){ go(PARENT[scr] || "home"); }

function render(){
  $("back").hidden = scr === "home";
  $("xp").textContent = `⭐ ${pts} XP`;
  $("title").textContent = {home:"Code Learner", langs:"Choose a language", levels:LANGS[lang].name, topics:`${LANGS[lang].name} · ${cap(lvl)}`, lesson:`Lesson ${cur+1}`}[scr];
  ({home:homeV, langs:langsV, levels:levelsV, topics:topicsV, lesson:lessonV})[scr]();
}

let user = null;

function homeV(){
  $("app").innerHTML = `
    <section class="auth">
      <div class="logo-wrap">${LOGO}</div>
      <h1 class="appname">Code Learner</h1>
      <p class="sub">Create an account to start learning</p>
      <form class="signup" onsubmit="signUp(event)">
        <label>Email
          <input id="em" type="email" autocomplete="email" placeholder="you@example.com" required>
        </label>
        <label>Password
          <div class="pw">
            <input id="pw" type="password" autocomplete="new-password" placeholder="At least 8 characters" oninput="meter()" required>
            <button type="button" id="eye" onclick="togglePw()">Show</button>
          </div>
        </label>
        <div class="meter"><i id="mt"></i></div>
        <div class="hint" id="mtx">Use 8+ characters with letters and numbers</div>
        <button class="start" type="submit">Create account</button>
        <div class="msg" id="msg"></div>
      </form>
      <ol class="flow" id="flow"></ol>
    </section>`;
}

function meter(){
  const v = $("pw").value;
  const s = (v.length >= 8) + (/[A-Za-z]/.test(v) && /\d/.test(v)) + (v.length >= 12 && /[^A-Za-z0-9]/.test(v));
  $("mt").style.width = ["0%","35%","70%","100%"][s];
  $("mt").style.background = ["#f87171","#fbbf24","#34d399","#22d3ee"][s];
  $("mtx").textContent = ["Too short","Weak","Good","Strong"][s];
}

function togglePw(){
  const p = $("pw");
  p.type = p.type === "password" ? "text" : "password";
  $("eye").textContent = p.type === "password" ? "Show" : "Hide";
}

function showFlow(text, note){
  $("flow").insertAdjacentHTML("beforeend", `<li class="${note ? 'note' : ''}">${text}</li>`);
}

function signUp(ev){
  ev.preventDefault();
  const email = $("em").value.trim().toLowerCase();
  const pw = $("pw").value;
  $("flow").innerHTML = "";
  $("msg").className = "msg";
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { $("msg").className = "msg err"; $("msg").textContent = "Enter a valid email address."; return; }
  if (pw.length < 8 || !/[A-Za-z]/.test(pw) || !/\d/.test(pw)) { $("msg").className = "msg err"; $("msg").textContent = "Password needs 8+ characters with letters and numbers."; return; }

  showFlow("1. Browser checks the email format and password strength on this device.");
  showFlow("2. The password is sent over HTTPS (encrypted in transit). It is never stored in the browser.");
  showFlow("3. Server receives the email and password.");
  showFlow("4. Server hashes the password with bcrypt, a one-way scramble. The plain password is discarded.");
  showFlow("5. Server saves only the email and the hash in the users table.");
  showFlow("6. Server confirms the account, and the password field is cleared.");
  showFlow("Demo mode: nothing leaves this page. A live app needs a backend (Supabase, Firebase, or your own server).", true);

  user = email;
  $("pw").value = "";
  $("mt").style.width = "0%";
  $("mtx").textContent = "Use 8+ characters with letters and numbers";
  $("msg").innerHTML = `✅ Account created for <b>${esc(email)}</b><br><button class="start" type="button" onclick="go('langs')">Continue →</button>`;
}

function langsV(){
  $("app").innerHTML = `<div class="grid">${Object.keys(LANGS).map(k => {
    const total = Object.values(DATA[k]).flat().length;
    const d = Object.keys(LEVELS).reduce((s, v) => s + prog(k, v), 0);
    return `<div class="tile ${LANGS[k].cls}" onclick="lang='${k}';go('levels')">
      <h2>${LANGS[k].name}</h2><p>${LANGS[k].desc}</p>
      <div class="prog">${d} of ${total} topics complete</div></div>`;
  }).join("")}</div>`;
}

function levelsV(){
  $("app").innerHTML = Object.keys(LEVELS).map(v => {
    const total = DATA[lang][v].length;
    return `<div class="lvl" onclick="lvl='${v}';go('topics')">
      <div><b>${cap(v)}</b><span>${LEVELS[v]}</span><span>${prog(lang, v)} of ${total} complete</span></div>
      <em>›</em></div>`;
  }).join("");
}

function topicsV(){
  const list = items(), d = prog(lang, lvl), pct = Math.round(d / list.length * 100);
  $("app").innerHTML = `
    <div class="hero ${LANGS[lang].cls}">
      <h2>${cap(lvl)} topics</h2>
      <p>Finish each topic to unlock the next one.</p>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <p>${d} of ${list.length} complete</p>
    </div>
    <div class="grid">${list.map((it, i) => {
      const open = unlocked(i), fin = done.has(lang+lvl+i);
      return `<div class="topic ${fin?"done":""} ${open?"":"locked"}" onclick="openLesson(${i})">
        <div class="row"><div class="num">${fin?"✓":open?i+1:"🔒"}</div><b>${it.t}</b></div>
        ${exList(it.e)}
        ${open?"":'<span class="tag">🔒 Finish the previous topic to unlock</span>'}
      </div>`;
    }).join("")}</div>`;
}

function openLesson(i){ if (!unlocked(i)) return; cur = i; go("lesson"); }

function lessonV(){
  const L = items()[cur];
  $("app").innerHTML = `
    <div class="card">
      <span class="pill">Lesson ${cur+1} of ${items().length}</span>
      <h2>${L.t}</h2>
      ${exList(L.e)}
      <div class="pre">${esc(L.c)}</div>
    </div>
    <div class="card">
      <h3>🧠 Quick quiz</h3>
      <p>${L.q}</p>
      ${L.o.map((o, j) => `<button class="opt" onclick="pick(${j})">${esc(o)}</button>`).join("")}
      <div class="fb" id="fb"></div>
      <button class="nextbtn" id="nx" onclick="next()">Next topic →</button>
    </div>`;
}

function pick(j){
  const key = lang+lvl+cur, L = items()[cur];
  if ($("nx").style.display === "block") return;
  const btns = document.querySelectorAll(".opt");
  if (j !== L.a) {
    btns[j].classList.add("bad"); btns[j].disabled = true;
    $("fb").textContent = "Not quite. Try another option to finish this topic!";
    return;
  }
  btns[L.a].classList.add("ok");
  if (!done.has(key)) pts += 10;
  done.add(key);
  $("fb").textContent = "🎉 Correct! +10 XP";
  $("nx").style.display = "block";
  $("xp").textContent = `⭐ ${pts} XP`;
}

function next(){
  if (cur < items().length - 1) { cur++; render(); window.scrollTo(0, 0); }
  else go("topics");
}

render();
</script>
</body>
</html>
